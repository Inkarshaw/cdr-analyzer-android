name: Build WA Location Desk APK
on:
  push:
    branches:
      - build-wa-location-desk-20261103
    paths:
      - .github/workflows/build-wa-location-desk.yml
      - wa-location-build/build_payload.b64
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract WA Location Desk source
        run: |
          mkdir -p wa-location-build/project
          base64 --decode wa-location-build/build_payload.b64 | tar -xJ -C wa-location-build/project
          find wa-location-build/project -maxdepth 2 -type f -print
      - name: Build debug APK
        run: gradle --no-daemon --project-dir wa-location-build/project :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WA-Location-Desk-debug-APK
          path: wa-location-build/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
